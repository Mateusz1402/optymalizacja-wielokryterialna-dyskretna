# Conda environment for the multi-criteria optimisation experiments app.
#   conda env create -f environment.yml
#   conda activate owd_env
#   streamlit run app.py
name: owd_env
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=1.26
  - pandas>=2.1
  - plotly>=5.20
  - streamlit>=1.50
